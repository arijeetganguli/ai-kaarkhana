<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" role="img" aria-labelledby="t d">
<title id="t">AI engineering maturity model</title>
<desc id="d">Five levels: ad hoc, guided, structured, measured, optimising.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F5A623"/></marker>
<pattern id="jaali" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M12 4 L20 12 L12 20 L4 12 z" fill="none" stroke="#F5A623" stroke-opacity="0.18" stroke-width="1"/></pattern>
</defs>
<rect width="1100" height="580" rx="18" fill="#14172B"/>
<rect width="1100" height="10" rx="5" fill="url(#jaali)" y="0" opacity="0"/>
<rect x="0" y="0" width="1100" height="26" fill="url(#jaali)" clip-path="inset(0 round 18px 18px 0 0)"/>
<rect x="0" y="576" width="1100" height="4" fill="#F5A623" opacity="0.9" clip-path="inset(0 round 0 0 18px 18px)"/>
<text x="40" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" fill="#F6F2E8" font-weight="800" text-anchor="start" >AI engineering maturity model</text>
<text x="40" y="88" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#B9BFDD" font-weight="400" text-anchor="start" >Climb by adding evidence and guardrails, not by generating more code.</text>
<rect x="40" y="360" width="196" height="150" rx="12" fill="#1E2347" stroke="#2CC4B8" stroke-width="2.2"/>
<text x="56" y="394" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#2CC4B8" font-weight="800" text-anchor="start" >1  Ad hoc</text>
<text x="56" y="420" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >Individuals</text>
<text x="56" y="440" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >experiment. No shared</text>
<text x="56" y="460" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >practice.</text>
<rect x="244" y="310" width="196" height="200" rx="12" fill="#1E2347" stroke="#F5A623" stroke-width="2.2"/>
<text x="260" y="344" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#F5A623" font-weight="800" text-anchor="start" >2  Guided</text>
<text x="260" y="370" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >Approved tools and</text>
<text x="260" y="390" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >shared guidance. AI</text>
<text x="260" y="410" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >use is disclosed.</text>
<rect x="448" y="260" width="196" height="250" rx="12" fill="#1E2347" stroke="#7BD88F" stroke-width="2.2"/>
<text x="464" y="294" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#7BD88F" font-weight="800" text-anchor="start" >3  Structured</text>
<text x="464" y="320" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >Skills and workflows</text>
<text x="464" y="340" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >in use. Tests are the</text>
<text x="464" y="360" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >evidence.</text>
<rect x="652" y="210" width="196" height="300" rx="12" fill="#1E2347" stroke="#FF7A6B" stroke-width="2.2"/>
<text x="668" y="244" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#FF7A6B" font-weight="800" text-anchor="start" >4  Measured</text>
<text x="668" y="270" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >Outcomes are</text>
<text x="668" y="290" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >measured. Feedback</text>
<text x="668" y="310" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >improves the</text>
<text x="668" y="330" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >practice.</text>
<rect x="856" y="160" width="196" height="350" rx="12" fill="#1E2347" stroke="#2CC4B8" stroke-width="2.2"/>
<text x="872" y="194" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#2CC4B8" font-weight="800" text-anchor="start" >5  Optimising</text>
<text x="872" y="220" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >Evidence driven</text>
<text x="872" y="240" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >improvement. Agents</text>
<text x="872" y="260" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="start" >act within limits.</text>
<text x="40" y="545" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#F6F2E8" font-weight="600" text-anchor="start" >Assess your team: docs/maturity_assessment.md</text>
</svg>
