<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">AI skill execution workflow</title>
<desc id="d">A task is matched to a skill, context is gathered, the skill produces structured output which is validated against a checklist before the developer decides.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F5A623"/></marker>
<pattern id="jaali" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M12 4 L20 12 L12 20 L4 12 z" fill="none" stroke="#F5A623" stroke-opacity="0.18" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="440" rx="18" fill="#14172B"/>
<rect width="1200" height="10" rx="5" fill="url(#jaali)" y="0" opacity="0"/>
<rect x="0" y="0" width="1200" height="26" fill="url(#jaali)" clip-path="inset(0 round 18px 18px 0 0)"/>
<rect x="0" y="436" width="1200" height="4" fill="#F5A623" opacity="0.9" clip-path="inset(0 round 0 0 18px 18px)"/>
<text x="40" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" fill="#F6F2E8" font-weight="800" text-anchor="start" >AI skill execution workflow</text>
<text x="40" y="88" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#B9BFDD" font-weight="400" text-anchor="start" >A skill is a repeatable procedure with a checklist, not a magic prompt.</text>
<rect x="30" y="140" width="168" height="100" rx="12" fill="#1E2347" stroke="#2CC4B8" stroke-width="1.6"/>
<rect x="30" y="150" width="5" height="80" rx="2.5" fill="#2CC4B8"/>
<text x="50" y="168" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#F6F2E8" font-weight="700" text-anchor="start" >1 Task</text>
<text x="50" y="190" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#B9BFDD" font-weight="400" text-anchor="start" >What do I need?</text>
<line x1="201" y1="190.0" x2="222" y2="190.0" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="226" y="140" width="168" height="100" rx="12" fill="#1E2347" stroke="#2CC4B8" stroke-width="1.6"/>
<rect x="226" y="150" width="5" height="80" rx="2.5" fill="#2CC4B8"/>
<text x="246" y="168" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#F6F2E8" font-weight="700" text-anchor="start" >2 Pick skill</text>
<text x="246" y="190" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#B9BFDD" font-weight="400" text-anchor="start" >Match by activity</text>
<line x1="397" y1="190.0" x2="418" y2="190.0" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="422" y="140" width="168" height="100" rx="12" fill="#1E2347" stroke="#F5A623" stroke-width="1.6"/>
<rect x="422" y="150" width="5" height="80" rx="2.5" fill="#F5A623"/>
<text x="442" y="168" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#F6F2E8" font-weight="700" text-anchor="start" >3 Context</text>
<text x="442" y="190" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#B9BFDD" font-weight="400" text-anchor="start" >Inputs the skill needs</text>
<line x1="593" y1="190.0" x2="614" y2="190.0" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="618" y="140" width="168" height="100" rx="12" fill="#1E2347" stroke="#F5A623" stroke-width="1.6"/>
<rect x="618" y="150" width="5" height="80" rx="2.5" fill="#F5A623"/>
<text x="638" y="168" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#F6F2E8" font-weight="700" text-anchor="start" >4 Execute</text>
<text x="638" y="190" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#B9BFDD" font-weight="400" text-anchor="start" >Follow the steps</text>
<line x1="789" y1="190.0" x2="810" y2="190.0" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="814" y="140" width="168" height="100" rx="12" fill="#1E2347" stroke="#7BD88F" stroke-width="1.6"/>
<rect x="814" y="150" width="5" height="80" rx="2.5" fill="#7BD88F"/>
<text x="834" y="168" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#F6F2E8" font-weight="700" text-anchor="start" >5 Output</text>
<text x="834" y="190" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#B9BFDD" font-weight="400" text-anchor="start" >Structured result</text>
<line x1="985" y1="190.0" x2="1006" y2="190.0" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="1010" y="140" width="168" height="100" rx="12" fill="#1E2347" stroke="#FF7A6B" stroke-width="1.6"/>
<rect x="1010" y="150" width="5" height="80" rx="2.5" fill="#FF7A6B"/>
<text x="1030" y="168" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#F6F2E8" font-weight="700" text-anchor="start" >6 Validate</text>
<text x="1030" y="190" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#B9BFDD" font-weight="400" text-anchor="start" >Checklist + tools</text>
<rect x="420" y="300" width="360" height="90" rx="12" fill="#283061" stroke="#F5A623" stroke-width="2.4"/>
<text x="600" y="335" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#F6F2E8" font-weight="800" text-anchor="middle" >Developer decision</text>
<text x="600" y="362" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#B9BFDD" font-weight="400" text-anchor="middle" >Accept · Revise · Reject</text>
<path d="M 1086 250 Q 1086 345 784 345" fill="none" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M 416 345 Q 100 345 100 246" fill="none" stroke="#B9BFDD" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="100" y="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#B9BFDD" font-weight="400" text-anchor="start" >Revise: tighten input,</text>
<text x="100" y="418" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#B9BFDD" font-weight="400" text-anchor="start" >re-run the skill</text>
</svg>
