<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="t d">
<title id="t">Edge case discovery</title>
<desc id="d">A requirement at the centre with eight categories of edge cases radiating from it.</desc>
