<text x="40" y="88" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#B9BFDD" font-weight="400" text-anchor="start" >Every stage has a human decision. AI accelerates; evidence decides.</text>
