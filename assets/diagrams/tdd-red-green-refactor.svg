<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d">
<title id="t">TDD red, green, refactor</title>
<desc id="d">Cycle: write a failing test (red), make it pass with the simplest code (green), improve the design while tests stay green (refactor).</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F5A623"/></marker>
<pattern id="jaali" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M12 4 L20 12 L12 20 L4 12 z" fill="none" stroke="#F5A623" stroke-opacity="0.18" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="620" rx="18" fill="#14172B"/>
<rect width="1000" height="10" rx="5" fill="url(#jaali)" y="0" opacity="0"/>
<rect x="0" y="0" width="1000" height="26" fill="url(#jaali)" clip-path="inset(0 round 18px 18px 0 0)"/>
<rect x="0" y="616" width="1000" height="4" fill="#F5A623" opacity="0.9" clip-path="inset(0 round 0 0 18px 18px)"/>
<text x="40" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" fill="#F6F2E8" font-weight="800" text-anchor="start" >Red, Green, Refactor</text>
<text x="40" y="88" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#B9BFDD" font-weight="400" text-anchor="start" >Short loops. The test comes first. AI drafts; you run and read the results.</text>
<rect x="355.0" y="144.0" width="290" height="112" rx="14" fill="#1E2347" stroke="#FF7A6B" stroke-width="2.5"/>
<text x="500" y="176" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#FF7A6B" font-weight="800" text-anchor="middle" >RED</text>
<text x="500" y="204" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#F6F2E8" font-weight="600" text-anchor="middle" >Write one failing test</text>
<text x="500" y="226" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="middle" >Run it. Confirm it fails</text>
<text x="500" y="244" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="middle" >for the right reason.</text>
<rect x="655.0" y="414.0" width="290" height="112" rx="14" fill="#1E2347" stroke="#7BD88F" stroke-width="2.5"/>
<text x="800" y="446" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#7BD88F" font-weight="800" text-anchor="middle" >GREEN</text>
<text x="800" y="474" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#F6F2E8" font-weight="600" text-anchor="middle" >Simplest code that passes</text>
<text x="800" y="496" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="middle" >Run all tests.</text>
<text x="800" y="514" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="middle" >No extra behaviour.</text>
<rect x="55.0" y="414.0" width="290" height="112" rx="14" fill="#1E2347" stroke="#2CC4B8" stroke-width="2.5"/>
<text x="200" y="446" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#2CC4B8" font-weight="800" text-anchor="middle" >REFACTOR</text>
<text x="200" y="474" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#F6F2E8" font-weight="600" text-anchor="middle" >Improve names, structure</text>
<text x="200" y="496" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="middle" >Tests stay green.</text>
<text x="200" y="514" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="middle" >No new behaviour.</text>
<path d="M 640 256 Q 760 300 800 408" fill="none" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M 650 485 Q 500 560 350 485" fill="none" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M 200 408 Q 230 290 358 230" fill="none" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="500" y="330" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#F5A623" font-weight="700" text-anchor="middle" >AI role:</text>
<text x="500" y="352" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="middle" >propose tests and candidates,</text>
<text x="500" y="372" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#B9BFDD" font-weight="400" text-anchor="middle" >never mark them green for you.</text>
<text x="500" y="590" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#F6F2E8" font-weight="600" text-anchor="middle" >Repeat for the next behaviour from the scenario matrix.</text>
</svg>
