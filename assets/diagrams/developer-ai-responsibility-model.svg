<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="t d">
<title id="t">Developer and AI responsibility model</title>
<desc id="d">Developers own intent, decisions and accountability; AI drafts, explores and checks; automated evidence validates both.</desc>
<defs>
