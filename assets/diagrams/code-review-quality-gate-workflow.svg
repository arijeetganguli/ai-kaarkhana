<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
<title id="t">Code review and quality gate workflow</title>
<desc id="d">A pull request passes author checks, automated gates, independent AI review and human review before merging.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F5A623"/></marker>
<pattern id="jaali" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M12 4 L20 12 L12 20 L4 12 z" fill="none" stroke="#F5A623" stroke-opacity="0.18" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="480" rx="18" fill="#14172B"/>
<rect width="1200" height="10" rx="5" fill="url(#jaali)" y="0" opacity="0"/>
<rect x="0" y="0" width="1200" height="26" fill="url(#jaali)" clip-path="inset(0 round 18px 18px 0 0)"/>
<rect x="0" y="476" width="1200" height="4" fill="#F5A623" opacity="0.9" clip-path="inset(0 round 0 0 18px 18px)"/>
<text x="40" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" fill="#F6F2E8" font-weight="800" text-anchor="start" >Code review and quality gate workflow</text>
<text x="40" y="88" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#B9BFDD" font-weight="400" text-anchor="start" >Automated tools and AI review complement, never replace, accountable human review.</text>
<rect x="30" y="150" width="205" height="130" rx="12" fill="#1E2347" stroke="#2CC4B8" stroke-width="1.6"/>
<rect x="30" y="160" width="5" height="110" rx="2.5" fill="#2CC4B8"/>
<text x="50" y="178" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#F6F2E8" font-weight="700" text-anchor="start" >Author checks</text>
<text x="50" y="200" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="start" >Tests pass locally</text>
<text x="50" y="219.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="start" >Self review of diff</text>
<line x1="238" y1="215.0" x2="267" y2="215.0" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="271" y="150" width="205" height="130" rx="12" fill="#1E2347" stroke="#F5A623" stroke-width="1.6"/>
<rect x="271" y="160" width="5" height="110" rx="2.5" fill="#F5A623"/>
<text x="291" y="178" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#F6F2E8" font-weight="700" text-anchor="start" >Automated gates</text>
<text x="291" y="200" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="start" >Lint, types, build</text>
<text x="291" y="219.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="start" >SAST, deps, coverage</text>
<line x1="479" y1="215.0" x2="508" y2="215.0" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="512" y="150" width="205" height="130" rx="12" fill="#1E2347" stroke="#FF7A6B" stroke-width="1.6"/>
<rect x="512" y="160" width="5" height="110" rx="2.5" fill="#FF7A6B"/>
<text x="532" y="178" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#F6F2E8" font-weight="700" text-anchor="start" >Independent AI review</text>
<text x="532" y="200" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="start" >Fresh context</text>
<text x="532" y="219.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="start" >Findings by severity</text>
<line x1="720" y1="215.0" x2="749" y2="215.0" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="753" y="150" width="205" height="130" rx="12" fill="#1E2347" stroke="#7BD88F" stroke-width="1.6"/>
<rect x="753" y="160" width="5" height="110" rx="2.5" fill="#7BD88F"/>
<text x="773" y="178" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#F6F2E8" font-weight="700" text-anchor="start" >Human review</text>
<text x="773" y="200" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="start" >Intent, design, risk</text>
<text x="773" y="219.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="start" >Test evidence read</text>
<line x1="961" y1="215.0" x2="990" y2="215.0" stroke="#F5A623" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="994" y="150" width="205" height="130" rx="12" fill="#1E2347" stroke="#2CC4B8" stroke-width="1.6"/>
<rect x="994" y="160" width="5" height="110" rx="2.5" fill="#2CC4B8"/>
<text x="1014" y="178" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#F6F2E8" font-weight="700" text-anchor="start" >Merge</text>
<text x="1014" y="200" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="start" >All gates green</text>
<text x="1014" y="219.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#B9BFDD" font-weight="400" text-anchor="start" >Rollback known</text>
<path d="M 500 296 Q 500 360 132 360 Q 132 330 132 292" fill="none" stroke="#FF7A6B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="300" y="392" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#FF7A6B" font-weight="600" text-anchor="middle" >Any red gate or blocking finding returns the PR to the author</text>
<text x="40" y="440" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#F6F2E8" font-weight="600" text-anchor="start" >Severity scale: Blocker · Major · Minor · Nit. Blockers and majors must be resolved or explicitly accepted.</text>
</svg>
